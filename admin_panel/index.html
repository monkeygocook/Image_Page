<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Staff Console</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <header class="bar">
        <h1>Staff Console</h1>
        <div class="bar-right">
            <span id="whoami" class="muted"></span>
            <button id="btnLogout" class="btn btn-ghost" hidden>ออกจากระบบ</button>
        </div>
    </header>

    <main>
        <!-- หน้าจอที่ 1: ล็อกอิน -->
        <section id="viewLogin" class="card" hidden>
            <h2>เข้าสู่ระบบเจ้าหน้าที่</h2>
            <form id="formLogin">
                <label>อีเมล
                    <input id="inEmail" type="email" required autocomplete="username">
                </label>
                <label>รหัสผ่าน
                    <input id="inPass" type="password" required autocomplete="current-password">
                </label>
                <button class="btn btn-primary" type="submit">เข้าสู่ระบบ</button>
            </form>
        </section>

        <!-- หน้าจอที่ 2: ตารางผู้ใช้ -->
        <section id="viewConsole" class="card" hidden>
            <div class="row-between">
                <h2>จัดการผู้ใช้ (<span id="userCount">0</span>)</h2>
                <button id="btnReload" class="btn btn-ghost">รีเฟรช</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ชื่อ</th>
                            <th>อีเมล</th>
                            <th>สิทธิ์</th>
                            <th>สมัครเมื่อ</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="userRows"></tbody>
                </table>
            </div>
            <p id="emptyRow" class="muted" hidden>ยังไม่มีผู้ใช้ในระบบ</p>
        </section>

        <p id="msg" class="msg" hidden></p>
    </main>

    <script src="js/admin.js" defer></script>
</body>

</html>

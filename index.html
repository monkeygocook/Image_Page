<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>AI Image Generator</title>
</head>

<body>

    <header>
        <nav>
            <button class="genimage">GenImage</button>
            <button class="back">Back</button>
            <button class="icon">Icon</button>
            <button class="tone">Tone</button>
        </nav>
    </header>

    <main>

        <section>
            <h1>GenImage</h1>

            <form>

                <label for="prompt">Prompt</label>
                <textarea id="prompt" name="prompt" placeholder="Describe the image you want..." rows="5"
                    required></textarea>

                <label for="negative-prompt">Negative Prompt</label>
                <textarea id="negative-prompt" name="negative-prompt" placeholder="Describe what you don't want..."
                    rows="5"></textarea>

                <button type="submit">Generate</button>

            </form>
        </section>


        <section>

            <h2>Output</h2>

            <div class="output">
                <img src="image/Sultry White Kitsune Accessories Set.png" alt="Generated image">
            </div>

            <button class="download">Download</button>

        </section>

    </main>

</body>

</html>

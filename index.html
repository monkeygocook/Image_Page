<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>AI Image Generator</title>
</head>

<body>

    <header>
        <nav>
            <button class="genimage">GenImage</button>
            <button class="back">Back</button>
            <button class="icon">Icon</button>
            <button class="tone">Tone</button>
        </nav>
    </header>

    <main>

        <section>
            <h1>GenImage</h1>

            <form>

                <label for="prompt" class="input-label">Prompt</label>
                <textarea id="prompt" name="prompt" placeholder="Describe the image you want..." rows="5"
                    class="prompt-input" required></textarea>

                <label for="negative-prompt" class="input-label">Negative Prompt</label>
                <textarea id="negative-prompt" name="negative-prompt" placeholder="Describe what you don't want..."
                    rows="5" class="negative-prompt-input"></textarea>

                <button type="submit" class="generate">Generate</button>

            </form>
        </section>


        <section>

            <h2>Output</h2>

            <div class="image-container">
                <img src="image/Beta_T.png" alt="Generated AI Image" class="ai-image">
            </div>
            <div class="modal" id="imageModal">
                <span class="close">&times;</span>

                <img class="modal-image" id="modalImage">
            </div>

            <a href="image/Beta_T.png" download="my-generated-image.png" class="download-btn"><img
                    src="image/Downloads_29996.png" alt="Download Icon"></a>

        </section>

    </main>
    <script src="java/script.js"></script>
</body>

</html>

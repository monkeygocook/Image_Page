<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Image Studio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="mockBadge" class="mock-badge" hidden></div>

    <header class="topbar">
        <nav class="tabbar" id="tabBar"></nav>
        <button id="btnTabs" class="icon-btn" title="จัดการแท็บ">✏️</button>
        <div class="spacer"></div>
        <button id="btnAccount" class="avatar-btn" title="บัญชี"><span id="avatarText">?</span></button>
        <button id="btnMenu" class="icon-btn" title="เมนู">☰</button>

        <div id="menuPop" class="popover" hidden>
            <div class="pop-user"><strong id="popName">—</strong><small id="popMail"></small></div>
            <button class="pop-item" data-act="settings"><span>⚙️</span><span data-i18n="nav.settings"></span></button>
            <button class="pop-item" data-act="tabs"><span>✏️</span><span data-i18n="nav.tabs"></span></button>
            <hr>
            <button class="pop-item" data-act="auth"><span>👤</span><span id="popAuthLabel"></span></button>
        </div>
    </header>

    <main class="layout">
        <form id="genForm" class="panel" novalidate>

            <section id="promptGroup" class="group">
                <button type="button" id="clearPrompt" class="link-btn" data-i18n="prompt.clear"></button>
                <textarea id="promptInput" rows="4" data-i18n-ph="prompt.ph"></textarea>
                <textarea id="negativeInput" rows="4" data-i18n-ph="negative.ph"></textarea>
            </section>

            <section id="uploaderGroup" class="group">
                <div id="dropZone" class="dropzone" tabindex="0" role="button">
                    <div class="dz-icon">🖼️</div>
                    <p><span data-i18n="upload.cta"></span> <u data-i18n="upload.click"></u></p>
                    <small id="dzHint"></small>
                </div>
                <div id="filePreview" class="file-preview" hidden>
                    <img id="thumb" alt="">
                    <div class="fp-meta"><strong id="fileName"></strong><small id="fileSize"></small></div>
                    <button type="button" id="clearFile" class="link-btn danger" data-i18n="upload.remove"></button>
                </div>
                <input type="file" id="fileInput" hidden>
            </section>

            <section id="optionsGroup" class="group options"></section>

            <p id="hint" class="hint"></p>
            <button type="submit" id="submitBtn" class="cta">—</button>
        </form>

        <aside class="panel result">
            <div id="resultStage" class="stage">
                <p id="resultEmpty" class="stage-empty" data-i18n="result.empty"></p>
                <div id="spinner" class="spinner" hidden></div>
                <div id="compareWrap" class="compare" hidden>
                    <img id="beforeImage" alt="before">
                    <div id="afterClip" class="clip"><img id="resultImage" alt="result"></div>
                    <input type="range" id="compareRange" min="0" max="100" value="50">
                    <span class="cmp-tag left" data-i18n="result.before"></span>
                    <span class="cmp-tag right" data-i18n="result.after"></span>
                </div>
                <img id="soloImage" class="solo" alt="result" hidden>
            </div>
            <div class="stage-actions">
                <label id="compareToggleWrap" class="chk" hidden>
                    <input type="checkbox" id="compareToggle" checked>
                    <span data-i18n="result.compare"></span>
                </label>
                <button id="btnDownload" class="ghost" disabled>⬇ <span data-i18n="result.download"></span></button>
            </div>
        </aside>
    </main>

    <!-- ===== Modal: จัดการแท็บ ===== -->
    <div id="tabsModal" class="modal" hidden>
        <div class="modal-box">
            <h3 data-i18n="tabs.title"></h3>
            <p class="muted" data-i18n="tabs.desc"></p>
            <ul id="tabsList" class="tabs-list"></ul>
            <p id="tabsWarn" class="hint" hidden data-i18n="tabs.min"></p>
            <div class="modal-actions">
                <button class="ghost" data-close data-i18n="common.close"></button>
            </div>
        </div>
    </div>

    <!-- ===== Drawer: ตั้งค่า ===== -->
    <div id="settingsModal" class="modal" hidden>
        <div class="modal-box">
            <h3 data-i18n="settings.title"></h3>
            <label class="field">
                <span data-i18n="settings.lang"></span>
                <select id="langSelect">
                    <option value="th">ไทย</option>
                    <option value="en">English</option>
                </select>
            </label>
            <label class="field">
                <span data-i18n="settings.notes"></span>
                <textarea id="notesInput" rows="7" data-i18n-ph="settings.notesPh"></textarea>
            </label>
            <small id="notesStatus" class="muted"></small>
            <div class="modal-actions">
                <button id="btnReset" class="ghost danger" data-i18n="settings.reset"></button>
                <button class="ghost" data-close data-i18n="common.close"></button>
            </div>
        </div>
    </div>

    <!-- ===== Modal: ล็อกอิน ===== -->
    <div id="authModal" class="modal" hidden>
        <div class="modal-box narrow">
            <h3 id="authTitle"></h3>
            <form id="authForm">
                <label class="field" id="nameField" hidden>
                    <span data-i18n="auth.name"></span>
                    <input type="text" id="authName" autocomplete="name">
                </label>
                <label class="field">
                    <span data-i18n="auth.email"></span>
                    <input type="email" id="authEmail" autocomplete="email">
                </label>
                <label class="field">
                    <span data-i18n="auth.pass"></span>
                    <input type="password" id="authPass" autocomplete="current-password">
                </label>
                <p id="authErr" class="hint"></p>
                <button type="submit" class="cta" id="authSubmit"></button>
            </form>
            <button id="authSwitch" class="link-btn center"></button>
            <button id="authGuest" class="link-btn center muted" data-i18n="auth.guest"></button>
            <small class="muted center" data-i18n="auth.mockNote"></small>
            <button class="modal-x" data-close>✕</button>
        </div>
    </div>

    <script src="js/config.js" defer></script>
    <script src="js/script.js" defer></script>
</body>

</html>
